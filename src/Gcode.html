<script>
// ============================================================
//  Gcode.html — Lectura de G-code (lógica pura, sin DOM)
// ============================================================
//  Soporta Creality Print y OrcaSlicer. La mayoría de las claves son
//  comunes (ambos descienden de PrusaSlicer); las que difieren se
//  resuelven con una cadena de alternativas por dato, y cada resultado
//  dice de qué fuente salió para poder diagnosticarlo.
//
//  Se lee el archivo COMPLETO, no una ventana del principio y otra del
//  final: el bloque de configuración que separa los totales del final
//  crece con cada perfil de filamento, así que cualquier corte fijo se
//  queda corto tarde o temprano.
//
//  Para que eso escale, _barrer() recorre el texto con índices en una
//  sola pasada en vez de partirlo en un array de líneas, y solo
//  materializa las que empiezan por ';', 'T' o 'E'. Las de movimiento
//  —el 99% del archivo— se descartan mirando un único carácter.
//
//  Vive en su propio archivo, sin tocar el DOM, para poder probarlo
//  fuera del navegador contra G-codes reales.
// ============================================================

const Gcode = (() => {

  const LAMINADORES = [
    { clave: "creality", nombre: "Creality Print", patron: /generated by\s+Creality[_ ]?Print\s+V?([\d.]+)/i },
    { clave: "orca",     nombre: "OrcaSlicer",     patron: /generated by\s+OrcaSlicer\s+v?([\d.]+)/i },
    { clave: "prusa",    nombre: "PrusaSlicer",    patron: /generated by\s+PrusaSlicer\s+v?([\d.]+)/i },
    { clave: "bambu",    nombre: "Bambu Studio",   patron: /generated by\s+BambuStudio\s+v?([\d.]+)/i }
  ];

  // Modelos que la calculadora sabe cotizar, con cómo reconocerlos
  const MODELOS = [
    { opcion: "Ender 3 S1 Pro", reconoce: s => /ender/.test(s) && /s1/.test(s) },
    // \bhi\b y no "hi" suelto: si no, "High Speed" se confundiría con el modelo Hi
    { opcion: "Creality HI",    reconoce: s => /creality/.test(s) && /\bhi\b/.test(s) }
  ];

  // ── API ───────────────────────────────────────────────────

  /**
   * @param texto  El archivo .gcode completo.
   * @returns Datos de la pieza, más `fuentes` y `faltantes` para diagnóstico.
   */
  function parsear(texto) {
    const b = _barrer(texto || "");

    const laminador = detectarLaminador(texto || "");
    const tiempo    = _tiempo(b);
    const filamento = _filamento(b);
    const impresora = _impresora(b);
    const dims      = _dimensiones(b);

    const datos = {
      laminador,
      thumbnailBase64: _miniaturaMayor(b.miniaturas),
      tiempoTexto:     tiempo ? tiempo.texto : "",
      tiempoHoras:     tiempo ? horasDesdeTexto(tiempo.texto) : 0,
      gramos:          filamento ? filamento.total : null,
      carretes:        filamento ? filamento.carretes : [],
      impresoraCruda:  impresora ? impresora.valor : "",
      impresora:       impresora ? reconocerModelo(impresora.valor) : null,
      dimensiones:     dims,
      objetos:         b.objetos,
      herramientas:    b.herramientas,
      multicolor:      _multicolor(b, filamento),
      fuentes: {
        tiempo:      tiempo    ? tiempo.fuente    : null,
        filamento:   filamento ? filamento.fuente : null,
        impresora:   impresora ? impresora.fuente : null,
        dimensiones: dims      ? dims.fuente      : null
      },
      faltantes: []
    };

    if (!datos.tiempoHoras)                        datos.faltantes.push("tiempo");
    if (!datos.gramos)                             datos.faltantes.push("filamento");
    if (!datos.impresora)                          datos.faltantes.push("impresora");
    if (!dims || dims.x === null || dims.y === null) datos.faltantes.push("dimensiones");
    if (!datos.objetos.length)                     datos.faltantes.push("unidades");

    return datos;
  }

  // La línea "generated by ..." es la segunda del archivo; no hace falta
  // recorrerlo entero para encontrarla.
  function detectarLaminador(texto) {
    const inicio = texto.slice(0, 8192);
    for (const l of LAMINADORES) {
      const m = inicio.match(l.patron);
      if (m) return { clave: l.clave, nombre: l.nombre, version: m[1] };
    }
    return { clave: "desconocido", nombre: "laminador no reconocido", version: "" };
  }

  function reconocerModelo(crudo) {
    const s = String(crudo || "").toLowerCase();
    const encontrado = MODELOS.find(m => m.reconoce(s));
    return encontrado ? encontrado.opcion : null;
  }

  // Soporta "1d 7h 45m 35s", "19h 09m", "3h 6m 44s"
  function horasDesdeTexto(texto) {
    if (!texto) return 0;
    const parte = re => { const m = texto.match(re); return m ? parseInt(m[1], 10) : 0; };
    return parte(/(\d+)\s*d/i) * 24
         + parte(/(\d+)\s*h/i)
         + parte(/(\d+)\s*m/i) / 60
         + parte(/(\d+)\s*s/i) / 3600;
  }

  // ── Barrido ───────────────────────────────────────────────

  /**
   * Una sola pasada por el archivo recogiendo todo lo que hace falta:
   * los comentarios "clave = valor" (primera y última aparición de cada
   * uno, porque la cabecera y el bloque de configuración pueden repetir
   * una clave con valores distintos), las miniaturas, los objetos con
   * sus copias, los cambios de herramienta y los polígonos de contorno.
   */
  function _barrer(texto) {
    const primera = {}, ultima = {};
    const porObjeto = {}, herramientas = {};
    const caja = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity, puntos: 0 };
    const miniaturas = [];

    const RE_CLAVE    = /^;\s*([^=:]+?)\s*[:=]\s*(.*)$/;
    const RE_OBJETO   = /^;\s*printing object\s+(.+?)\s+id:(\d+)(?:\s+copy\s+(\d+))?/i;
    const RE_MINI_INI = /^;\s*thumbnail begin\s+(\d+)x(\d+)/i;
    const RE_MINI_FIN = /^;\s*thumbnail end/i;
    const RE_HERRAM   = /^T(\d+)\s*$/;
    const RE_NUMERO   = /-?\d+(?:\.\d+)?/g;

    let enMiniatura = false, tamMiniatura = 0, trozos = null;

    const n = texto.length;
    let i = 0;
    while (i < n) {
      let fin = texto.indexOf("\n", i);
      if (fin === -1) fin = n;
      let corte = fin;
      if (corte > i && texto.charCodeAt(corte - 1) === 13) corte--;   // CRLF

      const primerChar = texto.charCodeAt(i);

      if (primerChar === 59) {                    // ';' comentario
        const linea = texto.substring(i, corte);

        if (enMiniatura) {
          if (RE_MINI_FIN.test(linea)) {
            miniaturas.push({ tam: tamMiniatura, b64: trozos.join("") });
            enMiniatura = false;
            trozos = null;
          } else {
            trozos.push(linea.replace(/^;\s*/, "").trim());
          }
        } else {
          const ini = linea.match(RE_MINI_INI);
          if (ini) {
            // Dentro del bloque no se interpretan claves: el base64 lleva '='
            enMiniatura = true;
            tamMiniatura = parseInt(ini[1], 10) * parseInt(ini[2], 10);
            trozos = [];
          } else {
            const obj = linea.match(RE_OBJETO);
            if (obj) {
              const nombre = obj[1];
              if (!porObjeto[nombre]) porObjeto[nombre] = {};
              porObjeto[nombre][obj[2] + ":" + (obj[3] || 0)] = true;
            } else {
              const kv = linea.match(RE_CLAVE);
              if (kv) {
                const clave = kv[1].trim().toLowerCase();
                const valor = kv[2].trim();
                if (valor !== "") {
                  if (primera[clave] === undefined) primera[clave] = valor;
                  ultima[clave] = valor;
                }
              }
            }
          }
        }

      } else if (primerChar === 84) {             // 'T' cambio de herramienta
        const t = texto.substring(i, corte).match(RE_HERRAM);
        if (t) herramientas[parseInt(t[1], 10)] = true;

      } else if (primerChar === 69) {             // 'E' de EXCLUDE_OBJECT_DEFINE
        const linea = texto.substring(i, corte);
        const p = linea.indexOf("POLYGON=");
        if (p !== -1) {
          const nums = linea.slice(p).match(RE_NUMERO);
          if (nums) {
            for (let k = 0; k + 1 < nums.length; k += 2) {
              const x = parseFloat(nums[k]), y = parseFloat(nums[k + 1]);
              if (x < caja.minX) caja.minX = x;
              if (x > caja.maxX) caja.maxX = x;
              if (y < caja.minY) caja.minY = y;
              if (y > caja.maxY) caja.maxY = y;
              caja.puntos++;
            }
          }
        }
      }
      // cualquier otra línea (G0/G1/M...) se descarta sin materializarla

      i = fin + 1;
    }

    return {
      primera, ultima, miniaturas, caja,
      objetos: Object.keys(porObjeto).map(nombre => ({
        nombre,
        copias: Object.keys(porObjeto[nombre]).length
      })),
      herramientas: Object.keys(herramientas).map(Number).sort((a, b) => a - b)
    };
  }

  // ── Extractores ───────────────────────────────────────────

  // Del bloque de configuración, al final del archivo
  function _delPie(b, clave) { return b.ultima[clave.toLowerCase()]; }
  // De la cabecera, al principio
  function _deLaCabecera(b, clave) { return b.primera[clave.toLowerCase()]; }

  function _numero(valor) {
    if (valor === undefined || valor === null) return null;
    const n = parseFloat(String(valor).replace(",", "."));
    return isNaN(n) ? null : n;
  }

  function _tiempo(b) {
    const declarado = _delPie(b, "estimated printing time (normal mode)");
    if (declarado) return { texto: declarado, fuente: "estimated printing time" };

    // Respaldo: TIME_ELAPSED es acumulado, así que la última vale por todas
    const seg = _numero(_delPie(b, "TIME_ELAPSED"));
    if (seg > 0) return { texto: _segundosATexto(seg), fuente: "TIME_ELAPSED" };
    return null;
  }

  function _segundosATexto(seg) {
    const totalMin = Math.round(seg / 60);
    return `${Math.floor(totalMin / 60)}h ${String(totalMin % 60).padStart(2, "0")}m`;
  }

  // "; filament used [g] = 67.00" o multicarrete "= 0.00, 386.30, 112.38"
  function _filamento(b) {
    for (const clave of ["total filament used [g]", "filament used [g]", "filament_weight"]) {
      const valor = _delPie(b, clave);
      if (!valor) continue;
      const carretes = String(valor).split(",")
        .map(v => parseFloat(v.trim()))
        .filter(v => !isNaN(v));
      const total = carretes.reduce((s, v) => s + v, 0);
      if (total > 0) return { total, carretes, fuente: clave };
    }
    return null;
  }

  // printer_model vive en el bloque de configuración, al FINAL del archivo en
  // los dos laminadores. Buscarlo solo en la cabecera es por qué nunca se
  // detectaba la impresora.
  function _impresora(b) {
    for (const clave of ["printer_model", "printer_settings_id", "machine_name"]) {
      const valor = _delPie(b, clave) || _deLaCabecera(b, clave);
      if (valor) return { valor, fuente: clave };
    }
    return null;
  }

  function _miniaturaMayor(miniaturas) {
    if (!miniaturas.length) return null;
    const mayor = miniaturas.slice().sort((a, b) => b.tam - a.tam)[0];
    return mayor.b64 || null;
  }

  /**
   * Dimensiones en mm de lo que hay en la cama. Cadena de alternativas:
   *  1. MINX/MAXX/… — las declara Creality Print en su cabecera.
   *  2. Caja envolvente de los polígonos de EXCLUDE_OBJECT_DEFINE, que ambos
   *     laminadores emiten con el contorno real de cada objeto. Contrastado
   *     contra las MIN/MAX de un mismo modelo: coinciden en 0,04 mm.
   *  3. Solo la altura, desde max_z_height.
   */
  function _dimensiones(b) {
    const lim = {};
    ["MINX", "MAXX", "MINY", "MAXY", "MINZ", "MAXZ"].forEach(k => {
      const v = _numero(_deLaCabecera(b, k));
      if (v !== null) lim[k] = v;
    });

    const alturaDeclarada = _numero(_deLaCabecera(b, "max_z_height"));

    if (lim.MINX !== undefined && lim.MAXX !== undefined &&
        lim.MINY !== undefined && lim.MAXY !== undefined) {
      const z = (lim.MAXZ !== undefined && lim.MINZ !== undefined)
        ? lim.MAXZ - lim.MINZ
        : alturaDeclarada;
      return { x: lim.MAXX - lim.MINX, y: lim.MAXY - lim.MINY, z, fuente: "MIN/MAX" };
    }

    if (b.caja.puntos > 0) {
      return {
        x: b.caja.maxX - b.caja.minX,
        y: b.caja.maxY - b.caja.minY,
        z: alturaDeclarada,
        fuente: "EXCLUDE_OBJECT_DEFINE"
      };
    }

    if (alturaDeclarada !== null) {
      return { x: null, y: null, z: alturaDeclarada, fuente: "max_z_height" };
    }
    return null;
  }

  /**
   * Multicolor. Señales, de la más fiable a la menos:
   *  1. Más de una herramienta usada (T0/T1/…) — común a ambos laminadores.
   *  2. Más de un carrete con consumo en "filament used [g]".
   *  3. multicolor_method distinto de 0 — solo Creality Print.
   */
  function _multicolor(b, filamento) {
    if (b.herramientas.length > 1) {
      return { es: true, razon: `${b.herramientas.length} herramientas: T${b.herramientas.join(", T")}` };
    }
    const conConsumo = filamento ? filamento.carretes.filter(g => g > 0) : [];
    if (conConsumo.length > 1) {
      return { es: true, razon: `${conConsumo.length} carretes con consumo` };
    }
    const metodo = _numero(_deLaCabecera(b, "multicolor_method"));
    if (metodo !== null && metodo > 0) {
      return { es: true, razon: `multicolor_method = ${metodo}` };
    }
    return { es: false, razon: "una sola herramienta y un solo carrete" };
  }

  return { parsear, detectarLaminador, reconocerModelo, horasDesdeTexto, MODELOS };

})();
</script>
