<script>
// ============================================================
//  Script.html — JavaScript del cliente
// ============================================================

// Las tarifas las envía el servidor desde la hoja "Parámetros" al abrir el
// diálogo. No se definen aquí a propósito: si el cliente tuviera su propia
// copia, el preview podría mostrar un precio distinto al que se guarda.
let TARIFAS    = null;
let _parametros = [];   // [{ clave, descripcion, unidad, valor }]

const CONSUMO = {
  "Ender 3 S1 Pro": { kwhCalor: 0.0360, wImpresion: 152 },
  "Creality HI":    { kwhCalor: 0.0288, wImpresion: 180 }
};

// ── Estado ───────────────────────────────────────────────────
let _thumbnailBase64   = null;
let _multicolor        = false;
let _insumos           = [];       // [{ nombre, precioUnidad, esNuevo }]
let _catalogo          = [];       // cargado desde la hoja al abrir

// ============================================================
//  INICIALIZACIÓN — cargar catálogo al abrir el diálogo
// ============================================================

google.script.run
  .withSuccessHandler(catalogo => {
    _catalogo = catalogo || [];
    _poblarDatalist();
  })
  .obtenerCatalogoInsumos();

google.script.run
  .withSuccessHandler(cfg => {
    _parametros = (cfg && cfg.parametros) || [];
    TARIFAS = _parametros.reduce((acc, p) => { acc[p.clave] = p.valor; return acc; }, {});
    _aplicarTarifasEnUi();
    actualizarPreview();   // por si el G-code ya se cargó mientras llegaban
  })
  .withFailureHandler(err => {
    mostrarAlerta("❌ No se pudieron leer los parámetros de la hoja: " + err.message, "error");
  })
  .obtenerConfiguracion();

// Refleja en el diálogo las tarifas que acabamos de recibir: el % real de
// mantenimiento en su etiqueta y el pie con los valores aplicados.
function _aplicarTarifasEnUi() {
  const pct = TARIFAS.mantenimientoPct * 100;

  document.getElementById("pc-mantenimiento-label").textContent =
    `Mantenimiento (${_formatearNumero(pct)}%)`;

  const money = v => "$" + _formatearNumero(v);
  document.getElementById("pc-tarifas").innerHTML =
    `<b>Tarifas aplicadas:</b> ${money(TARIFAS.filamentoPorGramo)}/g · ` +
    `${money(TARIFAS.energiaPorKwh)}/kWh · ` +
    `mantenimiento ${_formatearNumero(pct)}% · ` +
    `venta ×${_formatearNumero(TARIFAS.multiplicadorVenta)}<br>` +
    `Se editan en la hoja <b>Parámetros</b>. Vuelve a abrir este diálogo para recargarlas.`;
}

function _poblarDatalist() {
  const dl = document.getElementById("catalogoList");
  dl.innerHTML = "";
  _catalogo.forEach(item => {
    const opt = document.createElement("option");
    opt.value       = item.nombre;
    opt.dataset.precio = item.precioUnidad;
    dl.appendChild(opt);
  });
}

// Autocompletar precio al seleccionar del catálogo
document.getElementById("insumoNombre").addEventListener("input", function () {
  const match = _catalogo.find(
    c => c.nombre.toLowerCase() === this.value.trim().toLowerCase()
  );
  if (match) document.getElementById("insumoPrecio").value = match.precioUnidad;
});

// ============================================================
//  INSUMOS
// ============================================================

function agregarInsumo() {
  const nombre = document.getElementById("insumoNombre").value.trim();
  const precio = parseFloat(document.getElementById("insumoPrecio").value);

  if (!nombre) { alert("Escribe el nombre del insumo."); return; }
  if (!precio || precio <= 0) { alert("Ingresa un precio válido."); return; }
  if (_insumos.find(i => i.nombre.toLowerCase() === nombre.toLowerCase())) {
    alert("Ya agregaste ese insumo."); return;
  }

  const enCatalogo = _catalogo.find(
    c => c.nombre.toLowerCase() === nombre.toLowerCase()
  );
  const esNuevo = !enCatalogo;

  _insumos.push({ nombre, precioUnidad: precio, esNuevo });

  document.getElementById("insumoNombre").value = "";
  document.getElementById("insumoPrecio").value = "";

  _renderizarInsumos();
  actualizarPreview();
}

function quitarInsumo(index) {
  _insumos.splice(index, 1);
  _renderizarInsumos();
  actualizarPreview();
}

function _renderizarInsumos() {
  const lista = document.getElementById("insumos-lista");
  const sub   = document.getElementById("insumos-subtotal");
  lista.innerHTML = "";

  if (_insumos.length === 0) {
    sub.style.display = "none";
    return;
  }

  const fmt = v => "$" + Math.round(v).toLocaleString("es-CO");

  _insumos.forEach((ins, i) => {
    const div = document.createElement("div");
    div.className = "insumo-item";
    div.innerHTML = `
      <span class="insumo-nombre">${ins.nombre}
        ${ins.esNuevo ? '<span class="insumo-nuevo">nuevo</span>' : ''}
      </span>
      <span class="insumo-precio">${fmt(ins.precioUnidad)}/u</span>
      <button class="btn-quitar-insumo" onclick="quitarInsumo(${i})" title="Quitar">✕</button>
    `;
    lista.appendChild(div);
  });

  const total = _insumos.reduce((s, i) => s + i.precioUnidad, 0);
  document.getElementById("insumos-subtotal-valor").textContent = fmt(total) + "/u";
  sub.style.display = "flex";
}

// ============================================================
//  LECTURA Y PARSEO DE G-CODE
// ============================================================

const dropZone  = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");

dropZone.addEventListener("dragover",  e => { e.preventDefault(); dropZone.classList.add("drag-over"); });
dropZone.addEventListener("dragleave", ()=> dropZone.classList.remove("drag-over"));
dropZone.addEventListener("drop", e => {
  e.preventDefault();
  dropZone.classList.remove("drag-over");
  if (e.dataTransfer.files[0]) procesarArchivo(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", () => {
  if (fileInput.files[0]) procesarArchivo(fileInput.files[0]);
});

function procesarArchivo(file) {
  if (!file.name.match(/\.(gcode|gc|gco)$/i)) {
    mostrarAlerta("El archivo no es un G-code válido.", "error"); return;
  }
  document.getElementById("nombrePieza").value = file.name.replace(/\.[^.]+$/, "");

  let textoHead = "", textoTail = "", textoFull = "", pendientes = 3;
  const intentarParsear = () => {
    if (--pendientes === 0) parsearGcode(textoHead, textoTail, textoFull);
  };
  const leer = (blob, cb) => {
    const r = new FileReader();
    r.onload = e => { cb(e.target.result); intentarParsear(); };
    r.readAsText(blob);
  };

  leer(file.slice(0, 307200),                       t => textoHead = t);
  leer(file.slice(Math.max(0, file.size - 30720)),  t => textoTail = t);
  leer(file,                                        t => textoFull = t);
}

function parsearGcode(textoHead, textoTail, textoFull) {
  const lineasHead = textoHead.split("\n");
  _thumbnailBase64 = null;
  let encontrados = [];

  _extraerThumbnail(lineasHead);
  _extraerTiempo(lineasHead, textoTail, encontrados);
  _extraerObjetos(textoFull, encontrados);
  _extraerMulticolor(textoFull);
  _extraerDatosHeader(lineasHead, textoTail, encontrados);

  const faltaFil = !encontrados.includes("filamento");
  mostrarAlerta(
    faltaFil
      ? "✅ Datos extraídos. ⚠️ Ingresa el peso del filamento manualmente."
      : "✅ Todos los datos extraídos automáticamente.",
    faltaFil ? "warning" : "success"
  );
  actualizarPreview();
}

function _extraerThumbnail(lineas) {
  const bloques = [];
  let activo = false, tam = 0, chunks = [];
  lineas.forEach(l => {
    const mIni = l.match(/^;\s*thumbnail begin\s+(\d+)x(\d+)/i);
    if (mIni) { activo = true; tam = parseInt(mIni[1]) * parseInt(mIni[2]); chunks = []; return; }
    if (activo && /^;\s*thumbnail end/i.test(l)) { bloques.push({ tam, b64: chunks.join("") }); activo = false; return; }
    if (activo) chunks.push(l.replace(/^;\s*/, "").trim());
  });
  if (bloques.length === 0) return;
  bloques.sort((a, b) => b.tam - a.tam);
  _thumbnailBase64 = bloques[0].b64;
  document.getElementById("thumbnail-img").src = "data:image/png;base64," + _thumbnailBase64;
  document.getElementById("thumbnail-wrap").style.display = "flex";
}

function _extraerTiempo(lineasHead, textoTail, encontrados) {
  // Fuente principal: "estimated printing time (normal mode)" en el tail.
  // Formato CP7: "1d 7h 45m 35s" o "19h 8m 34s"
  const lineasTail = textoTail.split("\n");
  for (const l of lineasTail) {
    const m = l.match(/^;\s*estimated printing time\s*\(normal mode\)\s*=\s*(.+)/i);
    if (m) {
      document.getElementById("tiempoTexto").value = m[1].trim();
      encontrados.push("tiempo");
      return;
    }
  }
  // Fallback: TIME_ELAPSED acumulado (menos preciso)
  let maxTime = 0;
  lineasTail.forEach(l => {
    const m = l.match(/^;TIME_ELAPSED:([\d.]+)/);
    if (m) { const v = parseFloat(m[1]); if (v > maxTime) maxTime = v; }
  });
  if (maxTime > 0) {
    document.getElementById("tiempoTexto").value = _segundosATexto(maxTime);
    encontrados.push("tiempo");
  }
}

function _extraerObjetos(textoFull, encontrados) {
  const idsPerObj = {};
  textoFull.split("\n").forEach(l => {
    const m = l.match(/^; printing object (.+?) id:(\d+)/);
    if (!m) return;
    const [, nombre, id] = m;
    if (!idsPerObj[nombre]) idsPerObj[nombre] = new Set();
    idsPerObj[nombre].add(id);
  });
  const objetos = Object.entries(idsPerObj).map(([nombre, ids]) => ({ nombre, copias: ids.size }));
  if (objetos.length === 0) return;
  const esEnsamble = objetos.length > 1;
  document.getElementById("unidadesPorCama").value = esEnsamble ? 1 : objetos[0].copias;
  _actualizarHintUnidades(objetos, esEnsamble);
  encontrados.push("unidades");
}

function _extraerMulticolor(textoFull) {
  const tools = new Set((textoFull.match(/^T(\d+)$/gm) || []).map(t => parseInt(t.slice(1))));
  _multicolor = tools.size > 1;
  const badge = document.getElementById("badgeMulticolor");
  badge.textContent      = _multicolor ? "🎨 Multicolor" : "Un color";
  badge.style.background = _multicolor ? "#cce5ff" : "#e0e0e0";
  badge.style.color      = _multicolor ? "#004085" : "#666";
}

function _extraerDatosHeader(lineas, textoTail, encontrados) {
  let minX=null, maxX=null, minY=null, maxY=null, minZ=null, maxZ=null;
  const lineasTail = textoTail.split("\n"); // definido aquí para que esté disponible en todo el scope
  lineas.forEach(l => {
    const mImp = l.match(/^;\s*printer_model\s*=\s*(.+)/i);
    if (mImp) {
      const raw = mImp[1].trim().toLowerCase();
      const sel = document.getElementById("impresora");
      if      (raw.includes("ender") && raw.includes("s1")) sel.value = "Ender 3 S1 Pro";
      else if (raw.includes("creality") && raw.includes("hi")) sel.value = "Creality HI";
      encontrados.push("impresora");
    }
    const mns = [
      [/^;\s*MINX\s*=\s*([\d.]+)/i, v => minX = v],
      [/^;\s*MAXX\s*=\s*([\d.]+)/i, v => maxX = v],
      [/^;\s*MINY\s*=\s*([\d.]+)/i, v => minY = v],
      [/^;\s*MAXY\s*=\s*([\d.]+)/i, v => maxY = v],
      [/^;\s*MINZ\s*=\s*([\d.]+)/i, v => minZ = v],
      [/^;\s*MAXZ\s*=\s*([\d.]+)/i, v => maxZ = v],
    ];
    mns.forEach(([re, fn]) => { const m = l.match(re); if (m) fn(parseFloat(m[1])); });
  });

  // Filamento [g] vive en el CONFIG_BLOCK al final del archivo (tail).
  // Puede ser mono-filamento: "; filament used [g] = 498.68"
  // o multi-carrete CFS:     "; filament used [g] = 0.00, 386.30, 112.38, 0.00"
  // Tomamos la primera ocurrencia de [g] y sumamos todos los valores.
  if (!encontrados.includes("filamento")) {
    for (const l of lineasTail) {
      const mFil = l.match(/^;\s*filament\s+used\s*\[g\]\s*=\s*(.+)/i);
      if (mFil) {
        const valores = mFil[1].split(",").map(v => parseFloat(v.trim())).filter(v => !isNaN(v));
        const totalG  = valores.reduce((s, v) => s + v, 0);
        if (totalG > 0) {
          document.getElementById("filamentoGramos").value = totalG.toFixed(2);
          encontrados.push("filamento");
        }
        break; // con la primera línea [g] es suficiente
      }
    }
  }

  // Nota: el G-code también trae "; total filament cost", el costo que calcula
  // el laminador con su propio precio de filamento. No se usa: el spec define
  // el costo como gramos × tarifa, y la tarifa vive en la hoja "Parámetros".
  if (maxX !== null && minX !== null) {
    document.getElementById("anchoMm").value = (maxX - minX).toFixed(1);
    document.getElementById("largoMm").value = (maxY - minY).toFixed(1);
    document.getElementById("altoMm").value  = (maxZ - minZ).toFixed(1);
    encontrados.push("dims");
  }
}

// ============================================================
//  HINT UNIDADES
// ============================================================

function _actualizarHintUnidades(objetos, esEnsamble) {
  const hint = document.getElementById("hintUnidades");
  if (objetos.length === 1 && objetos[0].copias === 1) {
    hint.innerHTML = `<strong>1 pieza</strong> detectada. ✅`;
  } else if (!esEnsamble) {
    hint.innerHTML = `<strong>${objetos[0].copias} copias</strong> de "<em>${objetos[0].nombre}</em>" detectadas. ✅<br>
      <span style="color:#777">Ajusta si es necesario.</span>`;
  } else {
    const lista = objetos.map(o => `<em>${o.nombre}</em>`).join(", ");
    hint.innerHTML = `<strong>${objetos.length} piezas distintas</strong> → asumido como <strong>1 producto ensamblado</strong>. ✅<br>
      <span style="color:#777">${lista}</span>`;
  }
}

document.getElementById("unidadesPorCama").addEventListener("input", function () {
  const u = parseInt(this.value) || 1;
  document.getElementById("hintUnidades").innerHTML = u === 1
    ? `<strong>1 unidad</strong> — toda la cama es 1 producto.`
    : `<strong>${u} unidades</strong> — el costo se divide entre ${u} piezas.`;
  actualizarPreview();
});

// ============================================================
//  PREVIEW EN TIEMPO REAL
// ============================================================

["filamentoGramos","anchoMm","largoMm","altoMm","nombrePieza"]
  .forEach(id => document.getElementById(id).addEventListener("input", actualizarPreview));
document.getElementById("impresora").addEventListener("change", actualizarPreview);

function actualizarPreview() {
  const gramos    = parseFloat(document.getElementById("filamentoGramos").value);
  const tiempoH   = _parsearTiempoAHoras(document.getElementById("tiempoTexto").value);
  const impresora = document.getElementById("impresora").value;
  const unidades  = parseInt(document.getElementById("unidadesPorCama").value) || 1;

  // Sin TARIFAS todavía (la llamada al servidor no ha vuelto) no se puede
  // calcular nada: mejor no mostrar cifras que mostrarlas mal.
  if (!TARIFAS || !gramos || !tiempoH || tiempoH <= 0) {
    document.getElementById("preview-costos").style.display = "none";
    document.getElementById("btnGuardar").disabled = true;
    return;
  }

  // Misma cadena que Calculadora.calcular: todo a precisión completa y se
  // redondea solo al pintar. Si aquí se redondeara paso a paso, el preview
  // diferiría en algunos pesos de lo que termina guardado en la hoja.
  const cfg          = CONSUMO[impresora];
  const kwh          = cfg.kwhCalor + (cfg.wImpresion / 1000) * tiempoH;
  const cFil         = gramos * TARIFAS.filamentoPorGramo;
  const cEn          = kwh * TARIFAS.energiaPorKwh;
  const sub          = cFil + cEn;
  const mant         = sub * TARIFAS.mantenimientoPct;
  const totalCama    = sub + mant;
  const cImpresionU  = totalCama / unidades;
  const insumosU     = _insumos.reduce((s, i) => s + i.precioUnidad, 0);
  const costoTotalU  = cImpresionU + insumosU;
  const pUni         = costoTotalU * TARIFAS.multiplicadorVenta;
  const totalVenta   = pUni * unidades;

  const fmt = v => "$" + Math.round(v).toLocaleString("es-CO");
  document.getElementById("pc-filamento").textContent     = fmt(cFil);
  document.getElementById("pc-filamento-detalle").textContent =
    `${_formatearNumero(gramos)} g × $${_formatearNumero(TARIFAS.filamentoPorGramo)}/g`;
  document.getElementById("pc-energia").textContent       = fmt(cEn);
  document.getElementById("pc-energia-detalle").textContent =
    `${kwh.toFixed(4)} kWh × $${_formatearNumero(TARIFAS.energiaPorKwh)}`;
  document.getElementById("pc-subtotal").textContent      = fmt(sub);
  document.getElementById("pc-mantenimiento").textContent = fmt(mant);
  document.getElementById("pc-total-cama").textContent    = fmt(totalCama);
  document.getElementById("pc-divider-label").textContent =
    unidades === 1 ? "÷ 1 unidad" : `÷ ${unidades} unidades`;
  document.getElementById("pc-costo-unidad").textContent  = fmt(cImpresionU);

  // Filas de insumos — solo visibles si hay insumos agregados
  const tieneInsumos = _insumos.length > 0;
  document.getElementById("divider-insumos").style.display     = tieneInsumos ? "flex" : "none";
  document.getElementById("row-insumos-u").style.display       = tieneInsumos ? "flex" : "none";
  document.getElementById("row-total-real").style.display      = tieneInsumos ? "flex" : "none";
  document.getElementById("row-total-real-cama").style.display = tieneInsumos ? "flex" : "none";

  if (tieneInsumos) {
    document.getElementById("pc-insumos-u").textContent        = fmt(insumosU);
    document.getElementById("pc-total-real").textContent       = fmt(costoTotalU);
    document.getElementById("pc-total-real-cama").textContent  = fmt(totalVenta);
  }

  const pctGanancia = Math.round((TARIFAS.multiplicadorVenta - 1) * 100);
  document.getElementById("pc-precio-unidad-label").textContent = `💰 Precio de venta/u (+${pctGanancia}% ganancia)`;
  document.getElementById("pc-precio-unidad").textContent = fmt(pUni);
  document.getElementById("pc-total-venta").textContent   = fmt(totalVenta);

  document.getElementById("preview-costos").style.display = "block";
  document.getElementById("btnGuardar").disabled = false;
}

// ============================================================
//  GUARDAR
// ============================================================

function guardar() {
  const btn = document.getElementById("btnGuardar");
  btn.disabled = true;
  btn.textContent = "Guardando...";

  const datos = {
    nombrePieza:     document.getElementById("nombrePieza").value.trim(),
    impresora:       document.getElementById("impresora").value,
    tiempoHoras:     _parsearTiempoAHoras(document.getElementById("tiempoTexto").value),
    filamentoGramos: parseFloat(document.getElementById("filamentoGramos").value),
    anchoMm:         parseFloat(document.getElementById("anchoMm").value)  || null,
    largoMm:         parseFloat(document.getElementById("largoMm").value)  || null,
    altoMm:          parseFloat(document.getElementById("altoMm").value)   || null,
    unidadesPorCama: parseInt(document.getElementById("unidadesPorCama").value) || 1,
    multicolor:      _multicolor,
    insumos:         _insumos.map(i => ({ nombre: i.nombre, precioUnidad: i.precioUnidad })),
    thumbnailBase64: _thumbnailBase64
  };

  google.script.run
    .withSuccessHandler(resp => {
      if (resp.ok) {
        mostrarAlerta("✅ " + resp.mensaje, "success");
        limpiarFormulario();
        // Recargar catálogo para incluir insumos recién creados
        google.script.run
          .withSuccessHandler(catalogo => { _catalogo = catalogo || []; _poblarDatalist(); })
          .obtenerCatalogoInsumos();
      }
      else          { mostrarAlerta("❌ " + resp.mensaje, "error"); }
      btn.disabled = false;
      btn.textContent = "Guardar en hoja";
    })
    .withFailureHandler(err => {
      mostrarAlerta("❌ " + err.message, "error");
      btn.disabled = false;
      btn.textContent = "Guardar en hoja";
    })
    .guardarCotizacion(datos);
}

// ============================================================
//  UTILIDADES
// ============================================================

function limpiarFormulario() {
  ["nombrePieza","tiempoTexto","filamentoGramos","anchoMm","largoMm","altoMm",
   "insumoNombre","insumoPrecio"]
    .forEach(id => document.getElementById(id).value = "");
  document.getElementById("impresora").value       = "Ender 3 S1 Pro";
  document.getElementById("unidadesPorCama").value = "1";
  document.getElementById("hintUnidades").innerHTML = "Carga un G-code para detectar automáticamente.";
  document.getElementById("preview-costos").style.display = "none";
  document.getElementById("thumbnail-wrap").style.display = "none";
  document.getElementById("thumbnail-img").src            = "";
  document.getElementById("btnGuardar").disabled          = true;
  document.getElementById("alertBox").className           = "alert";
  _thumbnailBase64   = null;
  _multicolor        = false;
  _insumos           = [];
  _renderizarInsumos();
  const badge = document.getElementById("badgeMulticolor");
  badge.textContent = "Carga un G-code";
  badge.style.background = "#e0e0e0";
  badge.style.color      = "#666";
}

function mostrarAlerta(msg, tipo) {
  const el = document.getElementById("alertBox");
  el.textContent = msg;
  el.className   = "alert " + tipo;
}

// Number() quita los ceros de relleno de toFixed: 80.00 → "80", 80.50 → "80,5"
function _formatearNumero(n) {
  return Number(Number(n).toFixed(2)).toLocaleString("es-CO");
}

// Se redondea a minutos antes de partir, o 3599 s saldría como "0h 60m"
function _segundosATexto(seg) {
  const totalMin = Math.round(seg / 60);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return `${h}h ${m.toString().padStart(2, "0")}m`;
}

function _parsearTiempoAHoras(texto) {
  // Soporta formato CP7: "1d 7h 45m 35s" o "19h 8m 34s" o "7h 30m"
  if (!texto) return 0;
  const mD = texto.match(/(\d+)\s*d/i);
  const mH = texto.match(/(\d+)\s*h/i);
  const mM = texto.match(/(\d+)\s*m/i);
  const mS = texto.match(/(\d+)\s*s/i);
  return (mD ? parseInt(mD[1]) * 24 : 0)
       + (mH ? parseInt(mH[1]) : 0)
       + (mM ? parseInt(mM[1]) : 0) / 60
       + (mS ? parseInt(mS[1]) : 0) / 3600;
}
</script>
